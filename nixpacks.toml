[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_22"]

[phases.install]
cmds = [
  "cd frontend && npm install",
  "cd backend && composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "cd backend && touch database/database.sqlite && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"
